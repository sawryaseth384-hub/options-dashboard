<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pro Trading Dashboard</title>

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<!-- Charts -->
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* ===== THEME ===== */
:root {
    --bg:#0B0E11;
    --card:#1C1F26;
    --border:#2B3139;
    --green:#00C076;
    --red:#F6465D;
    --yellow:#FFB119;
}

body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:white;
}

/* ===== HEADER ===== */
.header{
    display:flex;
    justify-content:space-between;
    padding:10px 20px;
    background:#111;
    align-items:center;
}

.search{
    background:#222;
    padding:6px 10px;
    border-radius:6px;
}

/* ===== LAYOUT ===== */
.container{
    display:grid;
    grid-template-columns:200px 1fr;
}

.sidebar{
    background:#111;
    height:100vh;
    padding:20px;
    transition:0.3s;
}

.sidebar div{
    margin:15px 0;
    cursor:pointer;
}

.main{
    padding:15px;
}

/* ===== GRID ===== */
.grid{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:10px;
}

.card{
    background:var(--card);
    padding:10px;
    border-radius:10px;
    border:1px solid var(--border);
    backdrop-filter: blur(10px);
}

/* ===== WATCHLIST ===== */
.watch-item{
    display:flex;
    justify-content:space-between;
    padding:5px;
    cursor:grab;
}

/* ===== TABLE ===== */
table{
    width:100%;
    border-collapse:collapse;
}

td,th{
    padding:8px;
    border-bottom:1px solid #333;
}

/* ===== COLORS ===== */
.green{color:var(--green)}
.red{color:var(--red)}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
    .container{grid-template-columns:1fr}
    .sidebar{display:none}
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div>📊 Pro Trader</div>
    <div class="search">🔍 Search (⌘K)</div>
    <div><i class="fa fa-bell"></i> <i class="fa fa-user"></i></div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
    <div>🏠 Home</div>
    <div>📈 Markets</div>
    <div>💼 Portfolio</div>
    <div>📜 Orders</div>
    <div>⭐ Watchlist</div>
</div>

<!-- MAIN -->
<div class="main">

<!-- GRID -->
<div class="grid">

<!-- LEFT: CHART -->
<div class="card">
    <div id="chart" style="height:300px;"></div>

    <div>
        <button onclick="changeTF('1D')">1D</button>
        <button onclick="changeTF('1W')">1W</button>
        <button onclick="changeTF('1M')">1M</button>
    </div>
</div>

<!-- RIGHT: WATCHLIST -->
<div class="card">
    <h4>Watchlist</h4>
    <div id="watchlist"></div>
</div>

</div>

<!-- POSITIONS -->
<div class="card">
<h4>Positions</h4>
<table>
<tr><th>Symbol</th><th>Qty</th><th>P&L</th></tr>
<tr><td>NIFTY CE</td><td>50</td><td class="green">+2500</td></tr>
<tr><td>BANKNIFTY PE</td><td>25</td><td class="red">-1200</td></tr>
</table>
</div>

<!-- MARKET DEPTH -->
<div class="card">
<h4>Market Depth</h4>
<div id="depth"></div>
</div>

<!-- MINI CHART -->
<div class="card">
<canvas id="miniChart"></canvas>
</div>

</div>
</div>

<script>

// ===== WATCHLIST =====
let stocks = [
 {name:"NIFTY",price:23700,change:120},
 {name:"BANKNIFTY",price:55200,change:300},
 {name:"RELIANCE",price:2900,change:-20}
];

function renderWL(){
    let wl=document.getElementById("watchlist");
    wl.innerHTML="";
    stocks.forEach((s,i)=>{
        let d=document.createElement("div");
        d.className="watch-item";
        d.draggable=true;

        d.innerHTML=`${s.name} ${s.price} 
        <span class="${s.change>0?'green':'red'}">${s.change}</span>`;

        wl.appendChild(d);
    });
}
renderWL();

// ===== LIVE UPDATE =====
setInterval(()=>{
    stocks.forEach(s=>{
        let move=(Math.random()*20-10);
        s.price+=move;
        s.change=move;
    });
    renderWL();
},3000);

// ===== CHART =====
const chart = LightweightCharts.createChart(document.getElementById('chart'),{
    layout:{background:{color:'#0B0E11'},textColor:'#fff'}
});

const candle = chart.addCandlestickSeries();

candle.setData([
 {time:'2024-01-01',open:100,high:110,low:90,close:105},
 {time:'2024-01-02',open:105,high:115,low:100,close:110},
]);

function changeTF(tf){
    alert("Timeframe: "+tf);
}

// ===== MINI CHART =====
new Chart(document.getElementById("miniChart"),{
 type:'line',
 data:{
  labels:[1,2,3,4,5],
  datasets:[{data:[10,20,15,25,30],borderColor:'#00C076'}]
 },
 options:{plugins:{legend:false}}
});

// ===== MARKET DEPTH =====
function renderDepth(){
 let d=document.getElementById("depth");
 d.innerHTML="";
 for(let i=0;i<5;i++){
  let bid=Math.random()*100;
  let ask=Math.random()*100;

  d.innerHTML+=`
   <div style="display:flex">
    <div style="background:green;width:${bid}px">${bid.toFixed(0)}</div>
    <div style="background:red;width:${ask}px">${ask.toFixed(0)}</div>
   </div>`;
 }
}
renderDepth();

</script>

</body>
</html>
