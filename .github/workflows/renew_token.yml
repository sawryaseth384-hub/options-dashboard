name: Renew Dhan Token

on:
  schedule:
    - cron: '0 12 * * *'   # runs daily at 12:00 UTC
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Run renewal script
        id: get_token
        run: |
          python refresh_token.py > output.txt
          NEW_TOKEN=$(cat output.txt | grep "NEW_TOKEN=" | cut -d= -f2)
          echo "new_token=$NEW_TOKEN" >> $GITHUB_OUTPUT
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
      - name: Update secrets.toml
        run: |
          sed -i "s|ACCESS_TOKEN = .*|ACCESS_TOKEN = \"${{ steps.get_token.outputs.new_token }}\"|" .streamlit/secrets.toml
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .streamlit/secrets.toml
          git commit -m "Auto-renew Dhan token" || exit 0
          git push
